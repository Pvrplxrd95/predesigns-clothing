<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Predesigns Clothing</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .auth-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
            background: linear-gradient(135deg, #f5f0ff 0%, #fff 50%, #f0f0ff 100%);
        }
        .auth-card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(106, 13, 173, 0.12);
            padding: 3rem;
            width: 100%;
            max-width: 440px;
            border: 1px solid rgba(106, 13, 173, 0.08);
        }
        .auth-card .logo-area {
            text-align: center;
            margin-bottom: 2rem;
        }
        .auth-card .logo-area img {
            height: 50px;
            margin-bottom: 0.5rem;
        }
        .auth-card .logo-area p {
            color: var(--mid-gray);
            font-size: 0.9rem;
            margin: 0;
        }
        .auth-card h1 {
            font-family: var(--font-secondary);
            color: var(--black);
            font-size: 1.8rem;
            margin-bottom: 0.5rem;
            text-align: center;
        }
        .auth-card .subtitle {
            text-align: center;
            color: var(--mid-gray);
            margin-bottom: 2rem;
        }
        .form-group {
            margin-bottom: 1.25rem;
        }
        .form-group label {
            display: block;
            font-weight: 600;
            color: var(--black);
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
        }
        .form-group input {
            width: 100%;
            padding: 0.85rem 1rem;
            border: 2px solid #e8e0f0;
            border-radius: 10px;
            font-size: 1rem;
            transition: border-color 0.3s;
            box-sizing: border-box;
        }
        .form-group input:focus {
            outline: none;
            border-color: var(--primary-purple);
        }
        .form-group .input-icon {
            position: relative;
        }
        .form-group .input-icon i {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--mid-gray);
        }
        .form-group .input-icon input {
            padding-left: 2.75rem;
        }
        .btn-full {
            width: 100%;
            padding: 1rem;
            font-size: 1rem;
            border-radius: 10px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 0.5rem;
        }
        .btn-primary.btn-full {
            background: var(--primary-purple);
            color: white;
        }
        .btn-primary.btn-full:hover {
            background: var(--dark-purple);
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(106, 13, 173, 0.3);
        }
        .auth-footer {
            text-align: center;
            margin-top: 1.5rem;
            color: var(--mid-gray);
        }
        .auth-footer a {
            color: var(--primary-purple);
            font-weight: 600;
            text-decoration: none;
        }
        .auth-footer a:hover {
            text-decoration: underline;
        }
        .error-msg {
            background: #fff0f0;
            color: #c0392b;
            padding: 0.85rem 1rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            font-size: 0.9rem;
            display: none;
            border: 1px solid #fdd;
        }
        .success-msg {
            background: #f0fff4;
            color: #27ae60;
            padding: 0.85rem 1rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            font-size: 0.9rem;
            display: none;
            border: 1px solid #d4edda;
        }
        .loading {
            opacity: 0.7;
            pointer-events: none;
        }
        .divider {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin: 1.5rem 0;
            color: var(--mid-gray);
            font-size: 0.85rem;
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #e8e0f0;
        }
        .btn-google {
            width: 100%;
            padding: 0.85rem 1rem;
            border: 2px solid #e8e0f0;
            border-radius: 10px;
            background: white;
            color: var(--black);
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            transition: all 0.3s;
        }
        .btn-google:hover {
            border-color: var(--primary-purple);
            background: #faf9fc;
        }
        .btn-google svg { width: 20px; height: 20px; }
    </style>
</head>
<body>

<div class="auth-page">
    <div class="auth-card">
        <div class="logo-area">
            <img src="images/logo.jpg" alt="Predesigns Clothing">
            <p>Purple Ray Group Division</p>
        </div>
        <h1>Welcome Back</h1>
        <p class="subtitle">Sign in to your Predesigns account</p>

        <div id="errorMsg" class="error-msg"></div>
        <div id="successMsg" class="success-msg"></div>

        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label for="email">Email Address</label>
                <div class="input-icon">
                    <i class="fas fa-envelope"></i>
                    <input type="email" id="email" name="email" placeholder="your@email.com" required autocomplete="email">
                </div>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <div class="input-icon">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="password" name="password" placeholder="Enter your password" required autocomplete="current-password">
                </div>
            </div>
            <button type="submit" class="btn btn-primary btn-full" id="submitBtn">
                Sign In
            </button>
        </form>

        <div class="divider">or continue with</div>

        <button type="button" class="btn-google" onclick="handleGoogleLogin()">
            <svg viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
            Continue with Google
        </button>

        <div class="auth-footer">
            Don't have an account? <a href="register.html">Create one</a>
        </div>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js" defer></script>
<script>
    async function handleLogin(e) {
        e.preventDefault();
        const form = document.getElementById('loginForm');
        const btn = document.getElementById('submitBtn');
        const errorEl = document.getElementById('errorMsg');
        const successEl = document.getElementById('successMsg');

        errorEl.style.display = 'none';
        successEl.style.display = 'none';
        form.classList.add('loading');
        btn.textContent = 'Signing in...';

        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;

        // Wait for Firebase to be ready
        let attempts = 0;
        while (!window.firebaseManager || !window.firebaseManager.isReady()) {
            await new Promise(r => setTimeout(r, 100));
            if (++attempts > 50) {
                errorEl.textContent = 'Auth service not ready. Please refresh and try again.';
                errorEl.style.display = 'block';
                form.classList.remove('loading');
                btn.textContent = 'Sign In';
                return;
            }
        }

        try {
            const userCredential = await firebase.auth().signInWithEmailAndPassword(email, password);
            const token = await userCredential.user.getIdToken();
            
            // Store for compatibility with non-Firebase modules
            localStorage.setItem('pd_auth_token', token);
            localStorage.setItem('pd_user', JSON.stringify({
                id: userCredential.user.uid,
                name: userCredential.user.displayName || email.split('@')[0],
                email: userCredential.user.email
            }));
            
            successEl.textContent = 'Login successful! Redirecting...';
            successEl.style.display = 'block';
            setTimeout(() => window.location.href = 'index.html', 800);
        } catch (err) {
            const messages = {
                'auth/user-not-found': 'No account found with this email.',
                'auth/wrong-password': 'Incorrect password. Please try again.',
                'auth/invalid-email': 'Invalid email address.',
                'auth/too-many-requests': 'Too many attempts. Please try again later.'
            };
            errorEl.textContent = messages[err.code] || 'Login failed. Please check your credentials.';
            errorEl.style.display = 'block';
        } finally {
            form.classList.remove('loading');
            btn.textContent = 'Sign In';
        }
    }

    async function handleGoogleLogin() {
        const errorEl = document.getElementById('errorMsg');
        const successEl = document.getElementById('successMsg');
        errorEl.style.display = 'none';
        successEl.style.display = 'none';

        let attempts = 0;
        while (!window.firebaseManager || !window.firebaseManager.isReady()) {
            await new Promise(r => setTimeout(r, 100));
            if (++attempts > 50) {
                errorEl.textContent = 'Auth service not ready. Please refresh and try again.';
                errorEl.style.display = 'block';
                return;
            }
        }

        const provider = new firebase.auth.GoogleAuthProvider();
        try {
            const result = await firebase.auth().signInWithPopup(provider);
            const token = await result.user.getIdToken();
            localStorage.setItem('pd_auth_token', token);
            localStorage.setItem('pd_user', JSON.stringify({
                id: result.user.uid,
                name: result.user.displayName || result.user.email.split('@')[0],
                email: result.user.email
            }));
            successEl.textContent = 'Signed in with Google! Redirecting...';
            successEl.style.display = 'block';
            setTimeout(() => window.location.href = 'index.html', 800);
        } catch (err) {
            errorEl.textContent = 'Google sign-in failed: ' + (err.message || 'Please try again.');
            errorEl.style.display = 'block';
        }
    }
</script>

</body>
</html>
