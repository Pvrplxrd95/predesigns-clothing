<!-- Snipcart Templates for Predesigns Clothing -->
<div class="sr-only">
    <!-- Custom cart header -->
    <div id="snipcart-header" class="snipcart-cart-header">
        <h2 class="snipcart-cart-header__title">Your Shopping Cart</h2>
        <button class="snipcart-cart-header__close" onclick="window.Snipcart.api.modal.close()">
            <i class="fas fa-times"></i>
        </button>
    </div>

    <!-- Empty cart state -->
    <div id="snipcart-empty-cart" class="snipcart-empty-cart">
        <i class="fas fa-shopping-bag"></i>
        <h3>Your cart is empty</h3>
        <p>Looks like you haven't added anything to your cart yet.</p>
        <button class="snipcart-button-secondary" onclick="window.Snipcart.api.modal.close()">
            Continue Shopping
        </button>
    </div>

    <!-- Cart item template -->
    <div id="snipcart-cart-item" class="snipcart-cart-item">
        <div class="snipcart-cart-item__image">
            <img snp:item-image alt="" class="snipcart-cart-item__image-img" />
        </div>
        <div class="snipcart-cart-item__details">
            <h3 class="snipcart-cart-item__title" snp:item-name></h3>
            <div class="snipcart-cart-item__price" snp:item-price></div>
            <div class="snipcart-cart-item__quantity">
                <button class="snipcart-cart-item__quantity-button" snp:item-quantity-decrease>-</button>
                <span class="snipcart-cart-item__quantity-value" snp:item-quantity></span>
                <button class="snipcart-cart-item__quantity-button" snp:item-quantity-increase>+</button>
            </div>
        </div>
        <button class="snipcart-cart-item__remove" snp:item-remove>
            <i class="fas fa-times"></i>
        </button>
    </div>

    <!-- Checkout button -->
    <div id="snipcart-footer" class="snipcart-cart-footer">
        <div class="snipcart-cart-footer__total">
            <span>Total:</span>
            <span class="snipcart-cart-footer__amount" snp:cart-total></span>
        </div>
        <button class="snipcart-button-primary snipcart-cart-footer__checkout" snp:cart-checkout>
            Proceed to Checkout
        </button>
    </div>

    <!-- Loading state -->
    <div id="snipcart-loading" class="snipcart-loading">
        <div class="snipcart-loading__spinner"></div>
        <p>Loading your cart...</p>
    </div>
</div>
