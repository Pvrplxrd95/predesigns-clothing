<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - Predesigns Clothing</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .auth-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
            background: linear-gradient(135deg, #f5f0ff 0%, #fff 50%, #f0f0ff 100%);
        }
        .auth-card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(106, 13, 173, 0.12);
            padding: 3rem;
            width: 100%;
            max-width: 440px;
            border: 1px solid rgba(106, 13, 173, 0.08);
        }
        .auth-card .logo-area {
            text-align: center;
            margin-bottom: 2rem;
        }
        .auth-card .logo-area img {
            height: 50px;
            margin-bottom: 0.5rem;
        }
        .auth-card .logo-area p {
            color: var(--mid-gray);
            font-size: 0.9rem;
            margin: 0;
        }
        .auth-card h1 {
            font-family: var(--font-secondary);
            color: var(--black);
            font-size: 1.8rem;
            margin-bottom: 0.5rem;
            text-align: center;
        }
        .auth-card .subtitle {
            text-align: center;
            color: var(--mid-gray);
            margin-bottom: 2rem;
        }
        .form-group {
            margin-bottom: 1.25rem;
        }
        .form-group label {
            display: block;
            font-weight: 600;
            color: var(--black);
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
        }
        .form-group input {
            width: 100%;
            padding: 0.85rem 1rem;
            border: 2px solid #e8e0f0;
            border-radius: 10px;
            font-size: 1rem;
            transition: border-color 0.3s;
            box-sizing: border-box;
        }
        .form-group input:focus {
            outline: none;
            border-color: var(--primary-purple);
        }
        .form-group .input-icon {
            position: relative;
        }
        .form-group .input-icon i {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--mid-gray);
        }
        .form-group .input-icon input {
            padding-left: 2.75rem;
        }
        .btn-full {
            width: 100%;
            padding: 1rem;
            font-size: 1rem;
            border-radius: 10px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 0.5rem;
        }
        .btn-primary.btn-full {
            background: var(--primary-purple);
            color: white;
        }
        .btn-primary.btn-full:hover {
            background: var(--dark-purple);
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(106, 13, 173, 0.3);
        }
        .auth-footer {
            text-align: center;
            margin-top: 1.5rem;
            color: var(--mid-gray);
        }
        .auth-footer a {
            color: var(--primary-purple);
            font-weight: 600;
            text-decoration: none;
        }
        .auth-footer a:hover {
            text-decoration: underline;
        }
        .error-msg {
            background: #fff0f0;
            color: #c0392b;
            padding: 0.85rem 1rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            font-size: 0.9rem;
            display: none;
            border: 1px solid #fdd;
        }
        .success-msg {
            background: #f0fff4;
            color: #27ae60;
            padding: 0.85rem 1rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            font-size: 0.9rem;
            display: none;
            border: 1px solid #d4edda;
        }
        .loading {
            opacity: 0.7;
            pointer-events: none;
        }
        .pw-strength {
            height: 4px;
            border-radius: 2px;
            margin-top: 0.4rem;
            background: #e0e0e0;
            transition: background 0.3s;
        }
        .pw-strength.weak { background: #e74c3c; width: 33%; }
        .pw-strength.medium { background: #f39c12; width: 66%; }
        .pw-strength.strong { background: #27ae60; width: 100%; }
    </style>
</head>
<body>

<div class="auth-page">
    <div class="auth-card">
        <div class="logo-area">
            <img src="images/logo.jpg" alt="Predesigns Clothing">
            <p>Purple Ray Group Division</p>
        </div>
        <h1>Create Account</h1>
        <p class="subtitle">Join Predesigns and start shopping</p>

        <div id="errorMsg" class="error-msg"></div>
        <div id="successMsg" class="success-msg"></div>

        <form id="registerForm" onsubmit="handleRegister(event)">
            <div class="form-group">
                <label for="name">Full Name</label>
                <div class="input-icon">
                    <i class="fas fa-user"></i>
                    <input type="text" id="name" name="name" placeholder="Your full name" required>
                </div>
            </div>
            <div class="form-group">
                <label for="email">Email Address</label>
                <div class="input-icon">
                    <i class="fas fa-envelope"></i>
                    <input type="email" id="email" name="email" placeholder="your@email.com" required>
                </div>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <div class="input-icon">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="password" name="password" placeholder="Min. 6 characters" required minlength="6" oninput="updateStrength(this.value)">
                </div>
                <div id="pwStrength" class="pw-strength"></div>
            </div>
            <div class="form-group">
                <label for="confirm">Confirm Password</label>
                <div class="input-icon">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="confirm" name="confirm" placeholder="Repeat your password" required>
                </div>
            </div>
            <button type="submit" class="btn btn-primary btn-full" id="submitBtn">
                Create Account
            </button>
        </form>

        <div class="auth-footer">
            Already have an account? <a href="login.html">Sign in</a>
        </div>
    </div>
</div>

<script>
    function getAPIUrl() {
        const host = window.location.hostname;
        const isLocal = host === 'localhost' || host === '127.0.0.1';
        return isLocal ? 'http://localhost:3000' : '';
    }

    function updateStrength(pw) {
        const el = document.getElementById('pwStrength');
        el.className = 'pw-strength';
        if (pw.length === 0) return;
        if (pw.length < 6) { el.classList.add('weak'); return; }
        if (pw.length < 10) { el.classList.add('medium'); return; }
        el.classList.add('strong');
    }

    async function handleRegister(e) {
        e.preventDefault();
        const form = document.getElementById('registerForm');
        const btn = document.getElementById('submitBtn');
        const errorEl = document.getElementById('errorMsg');
        const successEl = document.getElementById('successMsg');

        errorEl.style.display = 'none';
        successEl.style.display = 'none';
        form.classList.add('loading');
        btn.textContent = 'Creating account...';

        const name = document.getElementById('name').value.trim();
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        const confirm = document.getElementById('confirm').value;

        if (password !== confirm) {
            errorEl.textContent = 'Passwords do not match.';
            errorEl.style.display = 'block';
            form.classList.remove('loading');
            btn.textContent = 'Create Account';
            return;
        }

        try {
            const res = await fetch(getAPIUrl() + '/api/auth/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, email, password })
            });

            const data = await res.json();

            if (!res.ok) {
                errorEl.textContent = data.error || 'Registration failed. Please try again.';
                errorEl.style.display = 'block';
            } else {
                localStorage.setItem('pd_auth_token', data.token);
                localStorage.setItem('pd_user', JSON.stringify(data.user));
                successEl.textContent = 'Account created! Redirecting...';
                successEl.style.display = 'block';
                setTimeout(() => window.location.href = 'index.html', 800);
            }
        } catch (err) {
            errorEl.textContent = 'Connection error. Make sure you are online.';
            errorEl.style.display = 'block';
        } finally {
            form.classList.remove('loading');
            btn.textContent = 'Create Account';
        }
    }
</script>

</body>
</html>
